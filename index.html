<style type="text/tailwindcss">
  /* ===== KHỐI ĐỔI THƯƠNG HIỆU – màu nhấn ở --primary, font ở --app-font. Ngoài khối này không rải mã màu. ===== */
  :root {
    color-scheme: light;
    --app-font: "Be Vietnam Pro", ui-sans-serif, system-ui, sans-serif;
    --primary: #d6303a;            /* đỏ CineVin, chữ trắng trên nền này 4.8:1 */
    --primary-hover: #df5059;
    --primary-foreground: #ffffff;
    --primary-light: #d6303a14;
    --background: #f4f4f6; --surface: #ffffff; --foreground: #2c2c2c; --muted: #707070;
    --border: #f0f0f2; --border-strong: #eaeaea;
    --surface-overlay: #ffffff;
    --elevation-popover: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    --elevation-modal: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
    --item-hover: #f4f4f6; --chart-fill: var(--primary);
    --secondary: #e7e8ec; --secondary-hover: #dbdce2; --background-hover: #e7e7ea; --surface-hover: #f8f8fa;
    --button-hover-surface: #f1f1f3; --button-hover-page: #e4e4e7; --button-hover: var(--button-hover-page);
    --shadow-segment-track: inset 0 0 0 1px rgb(0 0 0 / 0.05), inset 0 1px 2px rgb(0 0 0 / 0.04);
    --shadow-segment-thumb: 0 0 0 1px rgb(0 0 0 / 0.04), 0 1px 2px rgb(0 0 0 / 0.06), 0 2px 6px -2px rgb(0 0 0 / 0.08);
    --ring-focus: rgba(214, 48, 58, 0.12); --border-focus: var(--primary);
    --danger: #c70036; --danger-bg: rgb(255 32 86 / 0.1);
    --error: #fb2c36; --error-text: #e7000b; --error-bg: #fef2f2; --error-border: #ffc9c9; --error-strong: #c10007;
    --success-bg: #ecfdf5; --success: #007a55; --warning-bg: #fffbeb; --warning: #bb4d00;
    --neutral-bg: #f4f4f5; --neutral: #52525c;
    --radius: 0.75rem;
  }
  /* ===== HẾT KHỐI ĐỔI THƯƠNG HIỆU ===== */
  @theme inline {
    --font-sans: var(--app-font);
    --color-primary: var(--primary); --color-primary-hover: var(--primary-hover); --color-primary-foreground: var(--primary-foreground); --color-primary-light: var(--primary-light);
    --color-background: var(--background); --color-background-hover: var(--background-hover); --color-surface: var(--surface); --color-surface-hover: var(--surface-hover);
    --color-surface-overlay: var(--surface-overlay); --color-item-hover: var(--item-hover); --color-foreground: var(--foreground); --color-muted: var(--muted);
    --color-border: var(--border); --color-border-strong: var(--border-strong); --color-chart-fill: var(--chart-fill);
    --color-secondary: var(--secondary); --color-secondary-hover: var(--secondary-hover); --color-button-hover: var(--button-hover);
    --color-success: var(--success); --color-success-bg: var(--success-bg); --color-warning: var(--warning); --color-warning-bg: var(--warning-bg);
    --color-err: var(--error-strong); --color-err-bg: var(--error-bg); --color-err-border: var(--error-border); --color-neutral: var(--neutral); --color-neutral-bg: var(--neutral-bg);
    --border-color-focus: var(--border-focus); --ring-color-focus: var(--ring-focus);
    --shadow-popover: var(--elevation-popover); --shadow-modal: var(--elevation-modal);
  }
  .bg-surface *, .bg-surface-overlay * { --button-hover: var(--button-hover-surface); }
</style>
